name: Validate v24 app
on:
  push:
    branches:
      - v24-world-game
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\\s\\S]*)<\\/script>/);
          if (!match) throw new Error('Inline script not found');
          fs.writeFileSync('/tmp/kopilka-v24.js', match[1]);
          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(x => x[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML ids: ' + duplicates.join(', '));
          NODE
      - name: Check JavaScript syntax
        run: node --check /tmp/kopilka-v24.js
